# The instances Candide operates for other people. Hand-kept: an instance is
# added when it is provisioned and removed when its owner takes it over — that
# line is the whole "leave the fleet" procedure.
#
# Each entry: name (matches the token line), url (the API root, no trailing
# slash), owner (a first name is enough — this file is public), since,
# optionally insecure: true for a self-signed local cert, and deploy: the
# shell command, run from the repo root, that puts the current checkout live
# there. The tower runs it on `d`; without one the instance is read-only.
#
# The health token of each instance lives OUTSIDE the repo, one line per
# instance, in ~/.maurice/ops/fleet-tokens:
#     aline=maur_…
# Mint it with ops/mint-health-token.ts or in that instance's admin → Tokens,
# scope "Health only". Without a token the row still shows reachability and
# the public version.

instances:
  - name: home
    url: https://localhost:3001
    owner: Candide
    since: 2026-03-01
    insecure: true
    # launchd runs the checkout itself: deploying is restarting on main.
    deploy: scripts/service.sh restart api
  # The two below live on the Scaleway host maurice-fleet (BASIC2-A2C-8G,
  # fr-par-1, since 2026-09-17) behind its one Caddy — one compose project each,
  # infra/container/MULTI-HOUSEHOLD.md. One deploy line serves every household
  # on that host: it builds here, pushes to rg.fr-par.scw.cloud/maurice and
  # recreates each of them on the new image.
  - name: aline
    url: https://aline.chezmaurice.eu
    owner: Aline
    since: 2026-09-01
    deploy: MAURICE_REGISTRY=rg.fr-par.scw.cloud/maurice scripts/deploy.sh maurice-fleet
  - name: review
    url: https://review.chezmaurice.eu
    owner: Candide (App Review account)
    since: 2026-09-12
    deploy: MAURICE_REGISTRY=rg.fr-par.scw.cloud/maurice scripts/deploy.sh maurice-fleet
