# The one door, for a host that holds several households.
#
#   docker compose -p maurice-edge -f compose.caddy.yml up -d
#
# Caddy is the only thing with a published port. Each household sits behind it
# on the `maurice-edge` network, reachable by container name and nothing else;
# no household publishes a port to the world.
#
# Adding a household is writing `sites/<name>.caddy` and reloading — the
# Caddyfile imports that directory rather than naming anyone, so this file and
# the reload command never change. `ops/household.sh` does both.
#
# Certificates: one per name, from Let's Encrypt, obtained and renewed by
# Caddy on its own. It needs :80 reachable for the HTTP challenge, which is
# also what redirects http → https. Let's Encrypt wants a contact address for
# that; it comes from the host's defaults.env like every other host-wide
# setting, and `ops/household.sh edge` passes that file in. Without it this
# refuses to start rather than run with an empty address.

name: maurice-edge

services:
  caddy:
    image: caddy:2-alpine
    container_name: maurice-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      MAURICE_ACME_EMAIL: ${MAURICE_ACME_EMAIL:?set MAURICE_ACME_EMAIL in defaults.env}
    volumes:
      # The multi-household Caddyfile — the one that imports sites/. The plain
      # `Caddyfile` beside it is the single-household version and names a
      # `maurice` container that does not exist here.
      - ./Caddyfile.multi:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy-data:/data      # the certificates — losing this re-issues them
      - caddy-config:/config
    networks:
      - maurice-edge
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  caddy-data:
  caddy-config:

networks:
  maurice-edge:
    external: true
