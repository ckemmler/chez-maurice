; Maurice's three application processes, under one init.
;
; Each program runs the same scripts/start-*.sh the macOS launchd agents run —
; not a container-only copy. They all end in `exec`, so supervisord watches the
; real process and a crash is a restart, the way launchd's KeepAlive behaves.
; Keeping one launch path means a fix to a start script reaches both installs.
;
; Logs go to stdout/stderr so `docker compose logs` is the one place to look;
; the scripts also write their own under ~/.maurice/logs.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:api]
command=/app/scripts/start-api.sh
directory=/app
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
; The API is the ingress every other process is reached through; start it first.
priority=10

[program:mcp-gateway]
command=/app/scripts/start-mcp-gateway.sh
directory=/app
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:web]
command=/app/scripts/start-web.sh
directory=/app
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
