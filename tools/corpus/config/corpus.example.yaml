# Corpus configuration — copy to corpus.yaml and adjust.
#
# corpus.yaml itself is gitignored: it names absolute paths on the machine it
# runs on. This example keeps the shape and the reasoning; only the paths are
# placeholders.
#
# Sources are read-only. A source whose path does not exist is dropped with a
# warning at load, so an install that has no Calibre library simply indexes
# less rather than failing.

# Vector store backend. sqlite_vec keeps one DB file per member under `store.path`
# (default tools/corpus/data/vectors/). The qdrant block below is retained only as
# a migration reference — the daemon is no longer required at runtime.
store:
  backend: sqlite_vec
  # path: /custom/vectors   # optional; defaults to tools/corpus/data/vectors/

qdrant:
  host: localhost
  port: 6333
  collection: akita-corpus

# The embedding model. Decided on 19 September 2026: the Qwen3-Embedding family,
# at 1024 dimensions everywhere — 0.6B through Ollama on a Mac (4B is three
# times slower for a gain the domains map does not show; 8B needs a GPU), and
# `qwen3-embedding-8b` on Scaleway for an instance without Ollama
# (infra/container/corpus.prod.yaml). The family is matryoshka-trained, so
# every size is asked for the same 1024 dimensions and a store has one shape
# whichever size wrote it — though never two models in the same store: the
# store pins the model that wrote it and refuses another at open.
#
# nomic-embed-text, the model before, does not separate French: every French
# conversation of a member landed in one block. A model change is a full
# re-index into a fresh store (`python -m src.main index --force`, and
# `--source conversations`), the old one kept beside it until checked.
#
# The embedder knows what each family expects in front of a query and a
# document (Qwen's instruction line, nomic's `search_query:`); `query_prefix`
# and `document_prefix` here override that when a model needs something else.
embedding:
  provider: ollama
  model: qwen3-embedding:0.6b
  base_url: http://localhost:11434/v1
  vector_size: 1024
  batch_size: 32

watcher:
  debounce_seconds: 2
  ignore_patterns:
    - "*.tmp"
    - "*.swp"
    - ".DS_Store"
    - "__pycache__"

sources:
  # Chapters and summaries no longer live inside the Calibre library: Calibre
  # renames a book's directory on every title or author edit, which lost every
  # artifact under it. They sit under the data dir instead, in a directory named
  # `<uuid>-<title>` — see server/data-api/services/calibreArtifacts.ts. The uuid
  # is the identity, the title is there so `book_title` (the filter
  # `search_in_book` takes) can still be read off the path.
  #
  # A library whose artifacts have not been migrated still has them in place;
  # point these two at the library root until you have run
  # `bun run server/scripts/migrate-calibre-artifacts.ts --apply`, then reindex —
  # the paths change, so every chapter is re-embedded once.
  calibre-summaries:
    path: ${MAURICE_CALIBRE_ARTIFACTS_DIR:-~/.maurice/calibre/artifacts}
    pattern: "**/chapter_summaries/*.txt"
    recursive: true
    chunking:
      method: semantic
      max_tokens: 512
      overlap_tokens: 50
    metadata:
      source_type: book
      extract_from_path:
        book_title: "parent.parent.name.re:^[0-9a-fA-F-]{36}-(.+)$"
        book_uuid: "parent.parent.name.re:^([0-9a-fA-F-]{36})-"
        chapter: stem

  calibre-chapters:
    path: ${MAURICE_CALIBRE_ARTIFACTS_DIR:-~/.maurice/calibre/artifacts}
    pattern: "**/chapters/*.txt"
    recursive: true
    chunking:
      method: fixed
      max_tokens: 1024
      overlap_tokens: 128
    metadata:
      source_type: book
      extract_from_path:
        book_title: "parent.parent.name.re:^[0-9a-fA-F-]{36}-(.+)$"
        book_uuid: "parent.parent.name.re:^([0-9a-fA-F-]{36})-"
        chapter: stem

  journal-thoughts:
    path: ${MAURICE_THOUGHTS_DIR:-~/thoughts}
    pattern: "**/*.md"
    recursive: true
    chunking:
      method: paragraph
      max_tokens: 256
      overlap_tokens: 0
    metadata:
      source_type: thought
      extract_from_path:
        date: stem

  research-dossiers:
    path: ${MAURICE_DOSSIERS_DIR:-~/dossiers}
    pattern: "**/*.md"
    recursive: true
    chunking:
      method: heading
      max_tokens: 1024
      overlap_tokens: 100
    metadata:
      source_type: dossier
      extract_from_frontmatter: true

  # Fiches — the working surface behind every book, film, series, podcast,
  # article and person in a member's garden. Until this source existed the
  # vector store held notes and nothing else: forty fiches of reading and
  # watching were invisible to semantic search.
  #
  # The pattern is depth-based rather than a collection list, because pathlib's
  # `match` (which the orchestrator uses to route a pushed path) supports no
  # brace expansion. `*-fiche.md` at <member>/<collection>/<locale>/ is exactly
  # the set, and it is the same discriminator web/src/content.config.ts uses.
  garden-fiches:
    path: ${MAURICE_GARDENS_DIR:-./web/gardens}
    pattern: "*/*/*/*-fiche.md"
    recursive: true
    member_from_path: parent.parent.parent.name
    member_lookup: garden_username
    chunking:
      method: semantic
      max_tokens: 512
      overlap_tokens: 50
    metadata:
      source_type: fiche
      extract_from_frontmatter: true
      extract_from_path:
        collection: parent.parent.name

  # Cards — the published front of a resource, plus the member's own writing:
  # blog posts, essays, pages. The fiche is the back of the card and often the
  # richer of the two, but the front is where a finished verdict gets written,
  # and it was as unsearchable as the fiche was.
  #
  # Expressed as a depth with exclusions because notes, fiches and cards all sit
  # at <member>/<dir>/<locale>/<file>.md and pathlib globs cannot say "not".
  garden-cards:
    path: ${MAURICE_GARDENS_DIR:-./web/gardens}
    pattern: "*/*/*/*.md"
    exclude:
      - "*/notes/*/*.md"      # garden-notes owns these
      - "*/*/*/*-fiche.md"    # garden-fiches owns these
    recursive: true
    member_from_path: parent.parent.parent.name
    member_lookup: garden_username
    chunking:
      method: semantic
      max_tokens: 512
      overlap_tokens: 50
    metadata:
      source_type: card
      extract_from_frontmatter: true
      extract_from_path:
        collection: parent.parent.name

  # Fragments — the long text hanging off a fiche: an article's full body as
  # captured at save time, or accumulated notes on a book. This is where "find
  # the piece that argued X" is actually answered; the fiche itself only holds
  # the metadata and a comment.
  garden-fragments:
    path: ${MAURICE_GARDENS_DIR:-./web/gardens}
    pattern: "*/*/*/*-fiche/_fragments/*.frag"
    recursive: true
    member_from_path: parent.parent.parent.parent.parent.name
    member_lookup: garden_username
    chunking:
      method: semantic
      max_tokens: 512
      overlap_tokens: 50
    metadata:
      source_type: fragment
      extract_from_frontmatter: true
      extract_from_path:
        collection: parent.parent.parent.parent.name
        resource_id: parent.parent.name

  # Per-member garden notes: web/gardens/<member>/notes/<locale>/<slug>.md.
  # member_from_path routes each note's embeddings into <member>.db. Fiches and
  # other garden content live outside notes/, so the pattern excludes them.
  garden-notes:
    path: ${MAURICE_GARDENS_DIR:-./web/gardens}
    pattern: "*/notes/*/*.md"
    recursive: true
    member_from_path: parent.parent.parent.name
    member_lookup: garden_username
    chunking:
      method: semantic
      max_tokens: 512
      overlap_tokens: 50
    metadata:
      source_type: note
      extract_from_frontmatter: true
      extract_from_path:
        locale: parent.name
        slug: stem

