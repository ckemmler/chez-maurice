name: Maurice
options:
  bundleIdPrefix: eu.chezmaurice
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true
  defaultConfig: Debug
  # Every language the app ships strings for. Dropping one here drops its
  # .lproj from the bundle, and L() then falls through to the raw key.
  knownRegions:
    - en
    - fr
    - it
    - de
    - es
    - pt
    - nl
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

packages:
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.0"

# The two apps are declared separately rather than as one `platform: [iOS,
# macOS]` target: they genuinely differ — the Mac build carries the sandbox,
# the hardened runtime and its own entitlements; the iOS one a checked-in
# Info.plist and a device family. A multi-platform target has no way to say
# that, and generating one silently dropped all of it.
targetTemplates:
  MauriceApp:
    type: application
    sources:
      - path: Maurice
        excludes:
          - Info.plist
    dependencies:
      - package: SwiftMath
        product: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.maurice
        DEVELOPMENT_TEAM: F5B4ZC8LEU
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chez Maurice
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Asked for at the moment the feature is used, so the wording has to say
        # what Maurice does with the permission, not just that it wants it.
        INFOPLIST_KEY_NSCameraUsageDescription: "Maurice uses the camera to take a profile photo or scan a household invitation."
        # Exactly what Dictation.chooseEngine does with the audio: the device,
        # the household's own machine, and an outside service only on a yes.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Maurice uses the microphone so you can dictate a message. Your voice is turned into text on this device, or on your household's server when it transcribes on its own machine. It goes to an outside service only if you allow it: Apple's speech recognition after asking you, or your household's AI provider if you turn that on in Settings."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Maurice turns your dictation into text on this device whenever your language has an offline model. If it doesn't, Maurice asks you first before sending any audio to Apple."
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Maurice_iOS:
    templates: [MauriceApp]
    platform: iOS
    sources:
      - path: Maurice-iOS-Info.plist
        buildPhase: none
      - path: Maurice_iOS.entitlements
        buildPhase: none
      # What the share extension and the app both read (ShareInbox).
      - path: Shared
      # The purpose strings in the app's seven languages (iOS wording).
      - path: InfoPlist/iOS
    dependencies:
      - target: MauriceShareExtension
    settings:
      base:
        PRODUCT_NAME: Maurice
        INFOPLIST_FILE: Maurice-iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Maurice_iOS.entitlements
        CODE_SIGN_IDENTITY: iPhone Developer
        TARGETED_DEVICE_FAMILY: "1,2"

  Maurice_macOS:
    templates: [MauriceApp]
    platform: macOS
    sources:
      - path: Maurice_macOS.entitlements
        buildPhase: none
      # The purpose strings in seven languages — the Mac's own camera line:
      # there is no invitation scanner on the Mac (PairingView is iOS-only).
      - path: InfoPlist/macOS
    settings:
      base:
        INFOPLIST_KEY_NSCameraUsageDescription: "Maurice uses the camera to take your profile photo."
        # The bundle is "Chez Maurice.app"; the Swift module stays Maurice, so
        # the source compiles unchanged on both platforms.
        PRODUCT_NAME: Chez Maurice
        PRODUCT_MODULE_NAME: Maurice
        CODE_SIGN_ENTITLEMENTS: Maurice_macOS.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        AUTOMATION_APPLE_EVENTS: NO
        # The sandbox capabilities as Xcode records them: the camera is for the
        # profile photo, the microphone for dictation, and nothing else is granted.
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        # Dictation in the composer needs the microphone.
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: YES
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: NO
        RUNTIME_EXCEPTION_ALLOW_DYLD_ENVIRONMENT_VARIABLES: NO
        RUNTIME_EXCEPTION_ALLOW_JIT: NO
        RUNTIME_EXCEPTION_ALLOW_UNSIGNED_EXECUTABLE_MEMORY: NO
        RUNTIME_EXCEPTION_DEBUGGING_TOOL: NO
        RUNTIME_EXCEPTION_DISABLE_EXECUTABLE_PAGE_PROTECTION: NO
        RUNTIME_EXCEPTION_DISABLE_LIBRARY_VALIDATION: NO

  # "Maurice" in the share sheet: carries a page to the app, which opens a new
  # conversation with the article as a card in the composer (ShareInbox).
  MauriceShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MauriceShareExtension
        excludes:
          - ShareExtensionPreprocessor.js
          - "*.entitlements"
      # Copied into the bundle, never compiled: Safari runs it inside the page.
      - path: MauriceShareExtension/ShareExtensionPreprocessor.js
        buildPhase: resources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.maurice.share
        DEVELOPMENT_TEAM: F5B4ZC8LEU
        CODE_SIGN_ENTITLEMENTS: MauriceShareExtension/MauriceShareExtension.entitlements
        CODE_SIGN_IDENTITY: iPhone Developer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maurice
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
    info:
      path: MauriceShareExtension/Info-Generated.plist
      properties:
        NSExtension:
          NSExtensionAttributes:
            # Runs in the Safari page before the sheet opens and hands back the
            # rendered DOM, so the server reads what you actually read instead
            # of fetching the URL and meeting a paywall.
            NSExtensionJavaScriptPreprocessingFile: ShareExtensionPreprocessor
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
