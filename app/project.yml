name: Maurice
options:
  bundleIdPrefix: eu.chezmaurice
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  generateEmptyDirectories: true
  defaultConfig: Debug
  # Every language the app ships strings for. Dropping one here drops its
  # .lproj from the bundle, and L() then falls through to the raw key.
  knownRegions:
    - en
    - fr
    - it
    - de
    - es
    - pt
    - nl
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.4.1"
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    from: "1.7.0"

# The two apps are declared separately rather than as one `platform: [iOS,
# macOS]` target: they genuinely differ — the Mac build carries the sandbox,
# the hardened runtime and its own entitlements; the iOS one a checked-in
# Info.plist and a device family. A multi-platform target has no way to say
# that, and generating one silently dropped all of it.
targetTemplates:
  MauriceApp:
    type: application
    sources:
      - path: Maurice
        excludes:
          - Info.plist
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: SwiftMath
        product: SwiftMath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.chezmaurice.app
        DEVELOPMENT_TEAM: 33DB976938
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chez Maurice
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Asked for at the moment the feature is used, so the wording has to say
        # what Maurice does with the permission, not just that it wants it.
        INFOPLIST_KEY_NSCameraUsageDescription: "Maurice uses the camera so you can take a profile photo."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Maurice uses the microphone so you can dictate a message instead of typing it."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Maurice turns your dictation into text on this device whenever your language has an offline model. If it doesn't, Maurice asks you first before sending any audio to Apple."
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
      configs:
        debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

targets:
  Maurice_iOS:
    templates: [MauriceApp]
    platform: iOS
    sources:
      - path: Maurice-iOS-Info.plist
        buildPhase: none
      - path: Maurice_iOS.entitlements
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Maurice
        INFOPLIST_FILE: Maurice-iOS-Info.plist
        CODE_SIGN_ENTITLEMENTS: Maurice_iOS.entitlements
        CODE_SIGN_IDENTITY: iPhone Developer
        TARGETED_DEVICE_FAMILY: "1,2"

  Maurice_macOS:
    templates: [MauriceApp]
    platform: macOS
    sources:
      - path: Maurice_macOS.entitlements
        buildPhase: none
    settings:
      base:
        # The bundle is "Chez Maurice.app"; the Swift module stays Maurice, so
        # the source compiles unchanged on both platforms.
        PRODUCT_NAME: Chez Maurice
        PRODUCT_MODULE_NAME: Maurice
        CODE_SIGN_ENTITLEMENTS: Maurice_macOS.entitlements
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        AUTOMATION_APPLE_EVENTS: NO
        # The sandbox capabilities as Xcode records them: the camera is for the
        # profile photo, and nothing else is granted.
        ENABLE_RESOURCE_ACCESS_CAMERA: YES
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: NO
        ENABLE_RESOURCE_ACCESS_CONTACTS: NO
        ENABLE_RESOURCE_ACCESS_LOCATION: NO
        ENABLE_RESOURCE_ACCESS_PHOTO_LIBRARY: NO
        RUNTIME_EXCEPTION_ALLOW_DYLD_ENVIRONMENT_VARIABLES: NO
        RUNTIME_EXCEPTION_ALLOW_JIT: NO
        RUNTIME_EXCEPTION_ALLOW_UNSIGNED_EXECUTABLE_MEMORY: NO
        RUNTIME_EXCEPTION_DEBUGGING_TOOL: NO
        RUNTIME_EXCEPTION_DISABLE_EXECUTABLE_PAGE_PROTECTION: NO
        RUNTIME_EXCEPTION_DISABLE_LIBRARY_VALIDATION: NO
